zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 1a3fadab2bce454d993be2685e873090
    name: Templates/Network devices
  templates:
  - uuid: 0924cf45abfb4cb0b4bf1e738dc00ff1
    template: Ubiquiti CloudKey G2 Plus by SNMP
    name: Ubiquiti CloudKey G2 Plus by SNMP
    description: Cloud Key G2 Plus monitoring using tested UCD-SNMP, IF-MIB and LM-SENSORS OIDs. SNMPv3 credentials
      belong on host interface. Disk IO indices correspond to the tested device, and temperature data remain raw
      (mixed scaling). Disk capacity and hardware uptime are not supported by tested OIDs.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: f074b997950c43fcb18a9ce73599bfd9
      name: CPU user percent
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.9.0]
      key: cloudkey.cpu.user
      delay: 1m
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 8d3c1292755a4a1a90c50f48f38020b8
      name: CPU system percent
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.10.0]
      key: cloudkey.cpu.system
      delay: 1m
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 5076bdd5a8224bbcbe26a317648a0156
      name: CPU idle percent
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.11.0]
      key: cloudkey.cpu.idle
      delay: 1m
      units: '%'
      tags:
      - tag: component
        value: cpu
    - uuid: 26e4385710a047fea2bd869fada827de
      name: CPU utilization
      type: CALCULATED
      key: cloudkey.cpu.util
      params: 100-last(//cloudkey.cpu.idle)
      delay: 1m
      value_type: FLOAT
      units: '%'
      description: 100 minus the device reported idle percentage.
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: 46f71f65cab44873a4eecab8c90b86d9
        expression: min(/Ubiquiti CloudKey G2 Plus by SNMP/cloudkey.cpu.util,10m)>90
        name: 'CloudKey: CPU utilization above 90% for 10m'
        priority: WARNING
    - uuid: 2daac3b5d5f24c888a47a2070b7fd279
      name: Reported CPU count
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.11.67.0]
      key: cloudkey.cpu.count
      delay: 1h
      description: SNMP reported processor count, not necessarily physical cores.
      tags:
      - tag: component
        value: cpu
    - uuid: d2bf43b659fd44439ee4b239ec91360a
      name: Memory total
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.5.0]
      key: cloudkey.mem.total
      delay: 1m
      units: B
      description: UCD-SNMP reports kB; multiplied by 1024. Free real is not Linux MemAvailable.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 1846a76c193045b3ba0002b5ce63ca2c
      name: Memory free real
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.6.0]
      key: cloudkey.mem.free
      delay: 1m
      units: B
      description: UCD-SNMP reports kB; multiplied by 1024. Free real is not Linux MemAvailable.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: fb904c8a219f409c8abd5fd6fc796172
      name: Memory buffers
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.14.0]
      key: cloudkey.mem.buffers
      delay: 1m
      units: B
      description: UCD-SNMP reports kB; multiplied by 1024. Free real is not Linux MemAvailable.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: b0df3250609740788c3c883e5777e5a6
      name: Memory cached
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.15.0]
      key: cloudkey.mem.cached
      delay: 1m
      units: B
      description: UCD-SNMP reports kB; multiplied by 1024. Free real is not Linux MemAvailable.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 2c591fbe566446a59a648a51267d767c
      name: Memory used excluding cache and buffers (estimate)
      type: CALCULATED
      key: cloudkey.mem.used.estimate
      params: last(//cloudkey.mem.total)-last(//cloudkey.mem.free)-last(//cloudkey.mem.buffers)-last(//cloudkey.mem.cached)
      delay: 1m
      value_type: FLOAT
      units: B
      description: Approximate active used memory based on classic UCD-SNMP counters; not identical to Linux MemAvailable.
      tags:
      - tag: component
        value: memory
    - uuid: 09593ee917e54d6d80494a65f819cddf
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: cloudkey.sys.name
      delay: 5m
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: 88db3d906738480694d1c0a4c2deb30f
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: cloudkey.sys.description
      delay: 5m
      value_type: CHAR
      tags:
      - tag: component
        value: system
    - uuid: e0bc0d9af8e045bfb3909db2ea9e8232
      name: SNMP management uptime
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: cloudkey.sys.uptime.seconds
      delay: 5m
      units: uptime
      description: SNMP sysUpTime is centiseconds since SNMP subsystem initialization; converted to seconds. Not
        guaranteed device boot time.
      tags:
      - tag: component
        value: system
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      value_type: FLOAT
    - uuid: e1b166ebc14148dbbab37d9ef5dd6edd
      name: eth0 received bits per second
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.3]
      key: cloudkey.net.eth0.in
      delay: 1m
      units: bps
      description: 64-bit IF-MIB counter, device-specific verified eth0 ifIndex 3. First poll has no rate.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: network
    - uuid: 02b0e13519ac45729f3a28a4486a1f30
      name: eth0 sent bits per second
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.3]
      key: cloudkey.net.eth0.out
      delay: 1m
      units: bps
      description: 64-bit IF-MIB counter, device-specific verified eth0 ifIndex 3. First poll has no rate.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      - type: MULTIPLIER
        parameters:
        - '8'
      tags:
      - tag: component
        value: network
    - uuid: b2758250dd8240aa8d69a93d793b67a1
      name: CPU load average (1 minute)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.10.1.5.1]
      key: cloudkey.load.1
      delay: 1m
      value_type: FLOAT
      description: UCD laLoadInt stores load x 100; divide by 100.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
    - uuid: b1fbf2df33224d55946adfdc128a17e7
      name: CPU load average (5 minutes)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.10.1.5.2]
      key: cloudkey.load.2
      delay: 1m
      value_type: FLOAT
      description: UCD laLoadInt stores load x 100; divide by 100.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
    - uuid: b5ac732e8c834ad3ad8578f9825ac5ef
      name: CPU load average (15 minutes)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.10.1.5.3]
      key: cloudkey.load.3
      delay: 1m
      value_type: FLOAT
      description: UCD laLoadInt stores load x 100; divide by 100.
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: cpu
    - uuid: 5375bedafc0149ff81cc52e7a85f4be6
      name: Swap total
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.3.0]
      key: cloudkey.swap.total
      delay: 5m
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 1c30a9169f7a4462838ba9f274053240
      name: Swap free
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.4.4.0]
      key: cloudkey.swap.free
      delay: 5m
      units: B
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '1024'
      tags:
      - tag: component
        value: memory
    - uuid: 34764f3e8c2c462f81372ce66197e2e3
      name: Disk sda read bytes/s
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.13.15.1.1.3.60]
      key: cloudkey.disk.sda.read.bps
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: UCD diskIO 32-bit cumulative byte counter for sda. Rate from successive samples. May wrap at
        4 GiB; high IO can distort measurements.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      tags:
      - tag: component
        value: storage
    - uuid: fdacdffe0dc74ef990d4ff3c8d6093be
      name: Disk sda write bytes/s
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.13.15.1.1.4.60]
      key: cloudkey.disk.sda.write.bps
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: UCD diskIO 32-bit cumulative byte counter for sda. Rate from successive samples. May wrap at
        4 GiB; high IO can distort measurements.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      tags:
      - tag: component
        value: storage
    - uuid: efbfc721039f4c248b937ffa0e61e7c2
      name: Disk mmcblk0 read bytes/s
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.13.15.1.1.3.11]
      key: cloudkey.disk.mmcblk0.read.bps
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: UCD diskIO 32-bit cumulative byte counter for mmcblk0. Rate from successive samples. May wrap
        at 4 GiB; high IO can distort measurements.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      tags:
      - tag: component
        value: storage
    - uuid: 1b70d2ab8abd48d388a91057b10ff71f
      name: Disk mmcblk0 write bytes/s
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.2021.13.15.1.1.4.11]
      key: cloudkey.disk.mmcblk0.write.bps
      delay: 1m
      value_type: FLOAT
      units: Bps
      description: UCD diskIO 32-bit cumulative byte counter for mmcblk0. Rate from successive samples. May wrap
        at 4 GiB; high IO can distort measurements.
      preprocessing:
      - type: CHANGE_PER_SECOND
        parameters: []
      tags:
      - tag: component
        value: storage
    discovery_rules:
    - uuid: 88f0ba96dafa42afb039a7359a30a599
      name: Temperature sensor discovery (raw values)
      type: SNMP_AGENT
      snmp_oid: discovery[{#SENSORNAME},1.3.6.1.4.1.2021.13.16.2.1.2]
      key: cloudkey.temp.discovery
      delay: 1h
      description: 'Discovers sensor names. Prototypes deliberately store raw units: the source mixes scales (e.g.
        44, 459, 46759, 20000).'
      item_prototypes:
      - uuid: 7b906476a95448ffb151ac9924641067
        name: Temperature sensor {#SENSORNAME} (raw)
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.2021.13.16.2.1.3.{#SNMPINDEX}]
        key: cloudkey.temp.raw[{#SNMPINDEX}]
        delay: 2m
        description: Raw sensor value. Do not interpret as Celsius until scale is verified for this sensor.
        tags:
        - tag: component
          value: temperature
