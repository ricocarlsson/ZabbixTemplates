zabbix_export:
  version: '7.4'
  template_groups:
  - uuid: 1a3fadab2bce454d993be2685e873090
    name: Templates/Network devices
  templates:
  - uuid: fc183cd862da4ba99c39182102b71955
    template: Aruba 2530 by SNMP
    name: Aruba 2530 by SNMP
    description: Custom Aruba 2530 (ArubaOS-Switch) template cloned from Zabbix 7.4 HP Enterprise Switch by SNMP. Preserves
      the original monitoring, discovery, triggers, graphs and adds IEEE POWER-ETHERNET-MIB PoE PSE consumption and budget
      (index 1), plus calculated utilization. SNMP OIDs verified on Aruba 2530 Top.
    groups:
    - name: Templates/Network devices
    items:
    - uuid: b0b5b1b4c2ce40cc924a09d99c35abcf
      name: ICMP ping
      type: SIMPLE
      key: icmpping
      description: 'The host accessibility by ICMP ping.


        0 - ICMP ping fails;

        1 - ICMP ping successful.

        '
      valuemap:
        name: Service state
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: b0b5a1a4e7834350b257ef9f3eb7de79
        expression: max(/Aruba 2530 by SNMP/icmpping,#3)=0
        name: 'Aruba 2530: Unavailable by ICMP ping'
        priority: HIGH
        description: Last three attempts returned timeout. Please check device connectivity.
        tags:
        - tag: scope
          value: availability
    - uuid: 282d77be97e84a42b6bf39b88fc4e95a
      name: ICMP loss
      type: SIMPLE
      key: icmppingloss
      value_type: FLOAT
      units: '%'
      description: The percentage of lost packets.
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 883754e3387a4a62925f155455051e87
        expression: min(/Aruba 2530 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Aruba 2530 by SNMP/icmppingloss,5m)<100
        name: 'Aruba 2530: High ICMP ping loss'
        opdata: 'Loss: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: ICMP packets loss detected.
        dependencies:
        - name: 'Aruba 2530: Unavailable by ICMP ping'
          expression: max(/Aruba 2530 by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 52dc71b93a2d4edab64931ed4be6db5a
      name: ICMP response time
      type: SIMPLE
      key: icmppingsec
      value_type: FLOAT
      units: s
      description: The ICMP ping response time (in seconds).
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 0540b20c4f2c49768515bfa087aaf22c
        expression: avg(/Aruba 2530 by SNMP/icmppingsec,5m)>{$ICMP_RESPONSE_TIME_WARN}
        name: 'Aruba 2530: High ICMP ping response time'
        opdata: 'Value: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: Average ICMP response time is too high.
        dependencies:
        - name: 'Aruba 2530: High ICMP ping loss'
          expression: min(/Aruba 2530 by SNMP/icmppingloss,5m)>{$ICMP_LOSS_WARN} and min(/Aruba 2530 by SNMP/icmppingloss,5m)<100
        - name: 'Aruba 2530: Unavailable by ICMP ping'
          expression: max(/Aruba 2530 by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
    - uuid: 7ef30e6cc3764836a68e1a369807278e
      name: SNMP traps (fallback)
      type: SNMP_TRAP
      key: snmptrap.fallback
      value_type: LOG
      description: The item is used to collect all SNMP traps unmatched by other snmptrap items
      logtimefmt: hh:mm:sszyyyy/MM/dd
      tags:
      - tag: component
        value: network
    - uuid: f44fcb1e1c50451a9c9a822dc4191cec
      name: System contact details
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.4.0]
      key: system.contact[sysContact.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        The textual identification of the contact person for this managed node, together with information on how to contact
        this person. If no contact information is known, the value is the zero-length string.

        '
      inventory_link: CONTACT
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 31300539722c49b58f6db705727687f6
      name: CPU utilization
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.11.2.14.11.5.1.9.6.1.0]
      key: system.cpu.util[hpSwitchCpuStat.0]
      value_type: FLOAT
      units: '%'
      description: 'MIB: STATISTICS-MIB

        The CPU utilization in percent(%).

        Reference: http://h20564.www2.hpe.com/hpsc/doc/public/display?docId=emr_na-c02597344&sp4ts.oid=51079

        '
      tags:
      - tag: component
        value: cpu
      triggers:
      - uuid: a53e8b19aca249879cdfe25ab294c7f9
        expression: min(/Aruba 2530 by SNMP/system.cpu.util[hpSwitchCpuStat.0],5m)>{$CPU.UTIL.CRIT}
        name: 'Aruba 2530: High CPU utilization'
        event_name: 'Aruba 2530: High CPU utilization (over {$CPU.UTIL.CRIT}% for 5m)'
        opdata: 'Current utilization: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: The CPU utilization is too high. The system might be slow to respond.
        tags:
        - tag: scope
          value: performance
    - uuid: cd3da7fefd73445fa902aa18306c057c
      name: System description
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.1.0]
      key: system.descr[sysDescr.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        A textual description of the entity. This value should

        include the full name and version identification of the system''s hardware type, software operating-system, and

        networking software.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: 795a4532248a4df3a96517bb4dcb939b
      name: Firmware version
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.11.2.14.11.5.1.1.3.0]
      key: system.hw.firmware
      delay: 1h
      value_type: CHAR
      description: 'MIB: NETSWITCH-MIB

        Contains the operating code version number (also known as software or firmware).

        For example, a software version such as A.08.01 is described as follows:

        A    the function set available in your router

        08   the common release number

        01   updates to the current common release

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 3f4c11618584498e895ae99baff00b6c
        expression: last(/Aruba 2530 by SNMP/system.hw.firmware,#1)<>last(/Aruba 2530 by SNMP/system.hw.firmware,#2) and length(last(/Aruba
          2530 by SNMP/system.hw.firmware))>0
        name: 'Aruba 2530: Firmware has changed'
        opdata: 'Current value: {ITEM.LASTVALUE1}'
        priority: INFO
        description: Firmware version has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 4e99fc1aad3d40b68f63300105ff218a
      name: Hardware serial number
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.4.1.11.2.36.1.1.2.9.0]
      key: system.hw.serialnumber
      delay: 1h
      value_type: CHAR
      description: 'MIB: SEMI-MIB'
      inventory_link: SERIALNO_A
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 1d
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: d2927b2180a04c36a614b6862e4f863d
        expression: last(/Aruba 2530 by SNMP/system.hw.serialnumber,#1)<>last(/Aruba 2530 by SNMP/system.hw.serialnumber,#2)
          and length(last(/Aruba 2530 by SNMP/system.hw.serialnumber))>0
        name: 'Aruba 2530: Device has been replaced'
        event_name: 'Aruba 2530: Device has been replaced (new serial number received)'
        priority: INFO
        description: The device serial number has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
    - uuid: 2edede500b2f45a1a12e6e692521e6c2
      name: Uptime (hardware)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.25.1.1.0]
      key: system.hw.uptime[hrSystemUptime.0]
      delay: 30s
      trends: '0'
      units: uptime
      description: 'MIB: HOST-RESOURCES-MIB

        The amount of time since this host was last initialized. Note that this is different from sysUpTime in the SNMPv2-MIB
        [RFC1907] because sysUpTime is the uptime of the network management portion of the system.

        '
      preprocessing:
      - type: CHECK_NOT_SUPPORTED
        parameters:
        - '-1'
        error_handler: CUSTOM_VALUE
        error_handler_params: '0'
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 4db1113ac34e408287dcadc75d9a5028
      name: System location
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.6.0]
      key: system.location[sysLocation.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        Physical location of the node (e.g., `equipment room`, `3rd floor`). If not provided, the value is a zero-length string.

        '
      inventory_link: LOCATION
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: c9c858888b4e42a4ab0dac0a085def86
      name: System name
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.5.0]
      key: system.name
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        An administratively-assigned name for this managed node.By convention, this is the node''s fully-qualified domain
        name. If the name is unknown, the value is the zero-length string.

        '
      inventory_link: NAME
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
      triggers:
      - uuid: 074e4f4567514a1abbc8c4a002beb856
        expression: last(/Aruba 2530 by SNMP/system.name,#1)<>last(/Aruba 2530 by SNMP/system.name,#2) and length(last(/Aruba
          2530 by SNMP/system.name))>0
        name: 'Aruba 2530: System name has changed'
        event_name: 'Aruba 2530: System name has changed (new name: {ITEM.VALUE})'
        priority: INFO
        description: The name of the system has changed. Acknowledge to close the problem manually.
        manual_close: 'YES'
        tags:
        - tag: scope
          value: notice
        - tag: scope
          value: security
    - uuid: 483e33113e78446d8cd1cd4b120fd2e0
      name: Uptime (network)
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.3.0]
      key: system.net.uptime[sysUpTime.0]
      delay: 30s
      trends: '0'
      units: uptime
      description: 'MIB: SNMPv2-MIB

        Time (in hundredths of a second) since the network management portion of the system was last re-initialized.

        '
      preprocessing:
      - type: MULTIPLIER
        parameters:
        - '0.01'
      tags:
      - tag: component
        value: system
    - uuid: 03bf280047d24d5b905cb3829c6517bd
      name: System object ID
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.1.2.0]
      key: system.objectid[sysObjectID.0]
      delay: 15m
      value_type: CHAR
      description: 'MIB: SNMPv2-MIB

        The vendor''s authoritative identification of the network management subsystem contained in the entity. This value
        is allocated within the SMI enterprises subtree (1.3.6.1.4.1) and provides an easy and unambiguous means for determining`what
        kind of box'' is being managed.  For example, if vendor`Flintstones, Inc.'' was assigned the subtree1.3.6.1.4.1.4242,
        it could assign the identifier 1.3.6.1.4.1.4242.1.1 to its `Fred Router''.

        '
      preprocessing:
      - type: DISCARD_UNCHANGED_HEARTBEAT
        parameters:
        - 12h
      tags:
      - tag: component
        value: system
    - uuid: d30066d58c99483eb383cb871d6d89ee
      name: SNMP agent availability
      type: INTERNAL
      key: zabbix[host,snmp,available]
      description: 'Availability of SNMP checks on the host. The value of this item corresponds to availability icons in the
        host list.

        Possible values:

        0 - not available

        1 - available

        2 - unknown

        '
      valuemap:
        name: zabbix.host.available
      tags:
      - tag: component
        value: health
      - tag: component
        value: network
      triggers:
      - uuid: 5ebcfc72edfc46909094401f2da04533
        expression: max(/Aruba 2530 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
        name: 'Aruba 2530: No SNMP data collection'
        opdata: 'Current state: {ITEM.LASTVALUE1}'
        priority: WARNING
        description: SNMP is not available for polling. Please check device connectivity and SNMP settings.
        dependencies:
        - name: 'Aruba 2530: Unavailable by ICMP ping'
          expression: max(/Aruba 2530 by SNMP/icmpping,#3)=0
        tags:
        - tag: scope
          value: availability
    - uuid: e70d3734d7a3484ea76a0716e46743a3
      name: 'PoE: Power consumption'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.105.1.3.1.1.4.1]
      key: poe.power.consumption
      delay: 1m
      units: W
      description: 'POWER-ETHERNET-MIB: pethMainPseConsumptionPower, index 1. Actual PoE draw in watts.'
      tags:
      - tag: component
        value: poe
    - uuid: be6f0bfbd946429aa8d9d78092dac620
      name: 'PoE: Power budget'
      type: SNMP_AGENT
      snmp_oid: get[1.3.6.1.2.1.105.1.3.1.1.2.1]
      key: poe.power.budget
      delay: 5m
      units: W
      description: 'POWER-ETHERNET-MIB: pethMainPsePower, index 1. PoE budget in watts.'
      tags:
      - tag: component
        value: poe
    - uuid: b5fb2dfca3cd496994a6046f1353e2e7
      name: 'PoE: Budget utilization'
      type: CALCULATED
      key: poe.power.utilization
      delay: 1m
      value_type: FLOAT
      units: '%'
      params: 100*last(//poe.power.consumption)/last(//poe.power.budget)
      description: Actual PoE power consumption divided by budget, as a percentage.
      tags:
      - tag: component
        value: poe
    discovery_rules:
    - uuid: 6146d4b1f8b34defaf0419271dfa171f
      name: Entity Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#ENT_CLASS},1.3.6.1.2.1.47.1.1.1.1.5,{#ENT_NAME},1.3.6.1.2.1.47.1.1.1.1.7]
      key: entity.discovery
      delay: 1h
      filter:
        conditions:
        - macro: '{#ENT_CLASS}'
          value: '3'
      item_prototypes:
      - uuid: 055d7f8434634da9ad5c9d07186c2703
        name: '{#ENT_NAME}: Hardware model name'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.2.{#SNMPINDEX}]
        key: system.hw.model[entPhysicalDescr.{#SNMPINDEX}]
        delay: 1h
        value_type: CHAR
        description: 'MIB: ENTITY-MIB'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: system
      - uuid: 80de5dcf5b1443d88baaa8a7e9f39475
        name: '{#ENT_NAME}: Hardware version(revision)'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.47.1.1.1.1.8.{#SNMPINDEX}]
        key: system.hw.version[entPhysicalHardwareRev.{#SNMPINDEX}]
        delay: 1h
        value_type: CHAR
        description: 'MIB: ENTITY-MIB'
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: system
    - uuid: 4acd124e63084d89acc0ffce9470e4fb
      name: FAN Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#ENT_CLASS},1.3.6.1.4.1.11.2.14.11.1.2.6.1.2,{#ENT_DESCR},1.3.6.1.4.1.11.2.14.11.1.2.6.1.7,{#ENT_STATUS},1.3.6.1.4.1.11.2.14.11.1.2.6.1.4]
      key: fan.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#ENT_CLASS}'
          value: .+8.3.2$
        - macro: '{#ENT_STATUS}'
          value: (1|2|3|4)
      description: 'Discovering all entities of hpicfSensorObjectId that ends with: 11.2.3.7.8.3.2 - fans and are present'
      item_prototypes:
      - uuid: a8af96d6c9f74cd7a8a1b08f5ebc3053
        name: '{#ENT_DESCR}: Fan status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.11.2.14.11.1.2.6.1.4.{#SNMPINDEX}]
        key: sensor.fan.status[hpicfSensorStatus.{#SNMPINDEX}]
        delay: 3m
        trends: '0'
        description: 'MIB: HP-ICF-CHASSIS

          Actual status indicated by the sensor: {#ENT_DESCR}

          '
        valuemap:
          name: HP-ICF-CHASSIS::hpicfSensorStatus
        tags:
        - tag: component
          value: fan
        trigger_prototypes:
        - uuid: be08c98c3de84ea398e6385dc02e9147
          expression: count(/Aruba 2530 by SNMP/sensor.fan.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS:\"bad\"}")=1
          name: 'Aruba 2530: {#ENT_DESCR}: Fan is in critical state'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: Please check the fan unit
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
        - uuid: d72dfd0ecc144b97a6f4abc6cb02cb5f
          expression: count(/Aruba 2530 by SNMP/sensor.fan.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_WARN_STATUS:\"warning\"}")=1
          name: 'Aruba 2530: {#ENT_DESCR}: Fan is in warning state'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: Please check the fan unit
          dependencies:
          - name: 'Aruba 2530: {#ENT_DESCR}: Fan is in critical state'
            expression: count(/Aruba 2530 by SNMP/sensor.fan.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$FAN_CRIT_STATUS:\"bad\"}")=1
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
    - uuid: 0380b94e408c4cfe858bc65907796db5
      name: Memory Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SNMPVALUE},1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.1]
      key: memory.discovery
      delay: 1h
      description: Discovery of NETSWITCH-MIB::hpLocalMemTable, A table that contains information on all the local memory
        for each slot.
      item_prototypes:
      - uuid: b59f2b4deaf94f9b85e91f8237bc1b31
        name: '#{#SNMPVALUE}: Available memory'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.6.{#SNMPINDEX}]
        key: vm.memory.available[hpLocalMemFreeBytes.{#SNMPINDEX}]
        units: B
        description: 'MIB: NETSWITCH-MIB

          The number of available (unallocated) bytes.

          '
        tags:
        - tag: component
          value: memory
      - uuid: d1ea7c9003064523b5c6db30ba7ae2c8
        name: '#{#SNMPVALUE}: Total memory'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.5.{#SNMPINDEX}]
        key: vm.memory.total[hpLocalMemTotalBytes.{#SNMPINDEX}]
        units: B
        description: 'MIB: NETSWITCH-MIB

          The number of currently installed bytes.

          '
        tags:
        - tag: component
          value: memory
      - uuid: 58c6f3b005734329b6b9d45acbd716cc
        name: '#{#SNMPVALUE}: Used memory'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.11.2.14.11.5.1.1.2.1.1.1.7.{#SNMPINDEX}]
        key: vm.memory.used[hpLocalMemAllocBytes.{#SNMPINDEX}]
        units: B
        description: 'MIB: NETSWITCH-MIB

          The number of currently allocated bytes.

          '
        tags:
        - tag: component
          value: memory
      - uuid: 5bf62f6f9940464b9a36f32a811b5a78
        name: '#{#SNMPVALUE}: Memory utilization'
        type: CALCULATED
        key: vm.memory.util[snmp.{#SNMPINDEX}]
        value_type: FLOAT
        units: '%'
        params: last(//vm.memory.used[hpLocalMemAllocBytes.{#SNMPINDEX}])/last(//vm.memory.total[hpLocalMemTotalBytes.{#SNMPINDEX}])*100
        description: Memory utilization in %.
        tags:
        - tag: component
          value: memory
        trigger_prototypes:
        - uuid: 37998d142361465f9d6002eb9c74bc1d
          expression: min(/Aruba 2530 by SNMP/vm.memory.util[snmp.{#SNMPINDEX}],5m)>{$MEMORY.UTIL.MAX}
          name: 'Aruba 2530: #{#SNMPVALUE}: High memory utilization'
          event_name: 'Aruba 2530: #{#SNMPVALUE}: High memory utilization (>{$MEMORY.UTIL.MAX}% for 5m)'
          priority: AVERAGE
          description: The system is running out of free memory.
          tags:
          - tag: scope
            value: capacity
          - tag: scope
            value: performance
      graph_prototypes:
      - uuid: 2aff24da89b04191a576729928ddd713
        name: '#{#SNMPVALUE}: Memory usage'
        ymin_type_1: FIXED
        graph_items:
        - drawtype: BOLD_LINE
          color: 199C0D
          item:
            host: Aruba 2530 by SNMP
            key: vm.memory.total[hpLocalMemTotalBytes.{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: GRADIENT_LINE
          color: F63100
          item:
            host: Aruba 2530 by SNMP
            key: vm.memory.available[hpLocalMemFreeBytes.{#SNMPINDEX}]
      - uuid: e4aa363317e04c2d847a7f2de93a3d22
        name: '#{#SNMPVALUE}: Memory utilization'
        ymin_type_1: FIXED
        ymax_type_1: FIXED
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: Aruba 2530 by SNMP
            key: vm.memory.util[snmp.{#SNMPINDEX}]
    - uuid: c50f0b966a0d41dfa4888853b1ff0705
      name: Network interfaces discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFADMINSTATUS},1.3.6.1.2.1.2.2.1.7,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2,{#IFTYPE},1.3.6.1.2.1.2.2.1.3]
      key: net.if.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.MATCHES}'
        - macro: '{#IFADMINSTATUS}'
          value: '{$NET.IF.IFADMINSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.MATCHES}'
        - macro: '{#IFALIAS}'
          value: '{$NET.IF.IFALIAS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.MATCHES}'
        - macro: '{#IFDESCR}'
          value: '{$NET.IF.IFDESCR.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.MATCHES}'
        - macro: '{#IFNAME}'
          value: '{$NET.IF.IFNAME.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.MATCHES}'
        - macro: '{#IFOPERSTATUS}'
          value: '{$NET.IF.IFOPERSTATUS.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.MATCHES}'
        - macro: '{#IFTYPE}'
          value: '{$NET.IF.IFTYPE.NOT_MATCHES}'
          operator: NOT_MATCHES_REGEX
      description: Discovering interfaces from IF-MIB.
      item_prototypes:
      - uuid: 0d9c828fb991444ba2c0e87306077742
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.13.{#SNMPINDEX}]
        key: net.if.in.discards[ifInDiscards.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          The number of inbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 101d566a03c14bc782b2b8e873dc69c1
        name: 'Interface {#IFNAME}({#IFALIAS}): Inbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.14.{#SNMPINDEX}]
        key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of inbound packets that contained errors preventing them from being deliverable
          to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of inbound transmission
          units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities in
          the value of this counter can occur at re-initialization of the management system, and at other times as indicated
          by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: d4b9f29bd4724d24b5dc0b65445d6849
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits received'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.6.{#SNMPINDEX}]
        key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        delay: 3m
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets received on the interface, including framing characters. This object is a 64-bit version
          of ifInOctets. Discontinuities in the value of this counter can occur at re-initialization of the management system,
          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: d35eb8a8dd9e49d6bb049d344c469d6b
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets discarded'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.19.{#SNMPINDEX}]
        key: net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          The number of outbound packets which were chosen to be discarded

          even though no errors had been detected to prevent their being deliverable to a higher-layer protocol.

          One possible reason for discarding such a packet could be to free up buffer space.

          Discontinuities in the value of this counter can occur at re-initialization of the management system,

          and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 15d8be3cad904a0692792b31281e7eda
        name: 'Interface {#IFNAME}({#IFALIAS}): Outbound packets with errors'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.20.{#SNMPINDEX}]
        key: net.if.out.errors[ifOutErrors.{#SNMPINDEX}]
        delay: 3m
        description: 'MIB: IF-MIB

          For packet-oriented interfaces, the number of outbound packets that contained errors preventing them from being
          deliverable to a higher-layer protocol.  For character-oriented or fixed-length interfaces, the number of outbound
          transmission units that contained errors preventing them from being deliverable to a higher-layer protocol. Discontinuities
          in the value of this counter can occur at re-initialization of the management system, and at other times as indicated
          by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 8070ce6db35049b8ac5734fd61d4bd34
        name: 'Interface {#IFNAME}({#IFALIAS}): Bits sent'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.10.{#SNMPINDEX}]
        key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        delay: 3m
        units: bps
        description: 'MIB: IF-MIB

          The total number of octets transmitted out of the interface, including framing characters. This object is a 64-bit
          version of ifOutOctets.Discontinuities in the value of this counter can occur at re-initialization of the management
          system, and at other times as indicated by the value of ifCounterDiscontinuityTime.

          '
        preprocessing:
        - type: CHANGE_PER_SECOND
        - type: MULTIPLIER
          parameters:
          - '8'
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 6079c2d6fcd444ffa74d20a143d7ba25
        name: 'Interface {#IFNAME}({#IFALIAS}): Speed'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.31.1.1.1.15.{#SNMPINDEX}]
        key: net.if.speed[ifHighSpeed.{#SNMPINDEX}]
        delay: 5m
        trends: '0'
        units: bps
        description: 'MIB: IF-MIB

          An estimate of the interface''s current bandwidth in units of 1,000,000 bits per second. If this object reports
          a value of `n'' then the speed of the interface is somewhere in the range of `n-500,000'' to`n+499,999''.  For interfaces
          which do not vary in bandwidth or for those where no accurate estimation can be made, this object should contain
          the nominal bandwidth. For a sub-layer which has no concept of bandwidth, this object should be zero.

          '
        preprocessing:
        - type: MULTIPLIER
          parameters:
          - '1000000'
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1h
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      - uuid: 42a47d1f16b547f4b1160669d5b9075c
        name: 'Interface {#IFNAME}({#IFALIAS}): Operational status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.8.{#SNMPINDEX}]
        key: net.if.status[ifOperStatus.{#SNMPINDEX}]
        trends: '0'
        description: 'MIB: IF-MIB

          The current operational state of the interface.

          - The testing(3) state indicates that no operational packet scan be passed

          - If ifAdminStatus is down(2) then ifOperStatus should be down(2)

          - If ifAdminStatus is changed to up(1) then ifOperStatus should change to up(1) if the interface is ready to transmit
          and receive network traffic

          - It should change todormant(5) if the interface is waiting for external actions (such as a serial line waiting
          for an incoming connection)

          - It should remain in the down(2) state if and only if there is a fault that prevents it from going to the up(1)
          state

          - It should remain in the notPresent(6) state if the interface has missing(typically, hardware) components.

          '
        valuemap:
          name: IF-MIB::ifOperStatus
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 21a8455d50074e219f282265e8a83480
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
          name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): Link down'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: 'This trigger expression works as follows:

            1. It can be triggered if the operations status is down.

            2. `{$IFCONTROL:"{#IFNAME}"}=1` - a user can redefine the context macro to "0", marking this interface as not
            important. No new trigger will be fired if this interface is down.

            3. `{TEMPLATE_NAME:METRIC.diff()}=1` - the trigger fires only if the operational status was up to (1) sometime
            before (so, does not fire for "eternal off" interfaces.)


            WARNING: if closed manually - it will not fire again on the next poll, because of .diff.

            '
          manual_close: 'YES'
          tags:
          - tag: scope
            value: availability
      - uuid: 9316c8178ebf4aca95ca461a854bc17c
        name: 'Interface {#IFNAME}({#IFALIAS}): Interface type'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.2.2.1.3.{#SNMPINDEX}]
        key: net.if.type[ifType.{#SNMPINDEX}]
        delay: 1h
        trends: '0'
        description: 'MIB: IF-MIB

          The type of interface.

          Additional values for ifType are assigned by the Internet Assigned Numbers Authority (IANA),

          through updating the syntax of the IANAifType textual convention.

          '
        valuemap:
          name: IF-MIB::ifType
        preprocessing:
        - type: DISCARD_UNCHANGED_HEARTBEAT
          parameters:
          - 1d
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
      trigger_prototypes:
      - uuid: 94c365adde534d5281fcd36bc97e7770
        expression: 'change(/Aruba 2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])<0 and last(/Aruba 2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          and (

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=6 or

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=7 or

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=11 or

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=62 or

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=69 or

          last(/Aruba 2530 by SNMP/net.if.type[ifType.{#SNMPINDEX}])=117

          )

          and

          (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2)

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: '(change(/Aruba 2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0 and last(/Aruba 2530 by
          SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}],#2)>0) or

          (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2)

          '
        name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): Ethernet has changed to lower speed than it was before'
        opdata: 'Current reported speed: {ITEM.LASTVALUE1}'
        priority: INFO
        description: This Ethernet connection has transitioned down from its known maximum speed. This might be a sign of
          autonegotiation issues. Acknowledge to close the problem manually.
        manual_close: 'YES'
        dependencies:
        - name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 2dfcd8892b4641a68822957c7823be05
        expression: '(avg(/Aruba 2530 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Aruba
          2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) or

          avg(/Aruba 2530 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)>({$IF.UTIL.MAX:"{#IFNAME}"}/100)*last(/Aruba
          2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])) and

          last(/Aruba 2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])>0

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'avg(/Aruba 2530 by SNMP/net.if.in[ifHCInOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Aruba
          2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}]) and

          avg(/Aruba 2530 by SNMP/net.if.out[ifHCOutOctets.{#SNMPINDEX}],15m)<(({$IF.UTIL.MAX:"{#IFNAME}"}-3)/100)*last(/Aruba
          2530 by SNMP/net.if.speed[ifHighSpeed.{#SNMPINDEX}])

          '
        name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage'
        event_name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): High bandwidth usage (>{$IF.UTIL.MAX:"{#IFNAME}"}%)'
        opdata: 'In: {ITEM.LASTVALUE1}, out: {ITEM.LASTVALUE3}, speed: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: The utilization of the network interface is close to its estimated maximum bandwidth.
        manual_close: 'YES'
        dependencies:
        - name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: performance
      - uuid: 330c263d03d34d4c90a254dc1fb66661
        expression: 'min(/Aruba 2530 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          or min(/Aruba 2530 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)>{$IF.ERRORS.WARN:"{#IFNAME}"}

          '
        recovery_mode: RECOVERY_EXPRESSION
        recovery_expression: 'max(/Aruba 2530 by SNMP/net.if.in.errors[ifInErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          and max(/Aruba 2530 by SNMP/net.if.out.errors[ifOutErrors.{#SNMPINDEX}],5m)<{$IF.ERRORS.WARN:"{#IFNAME}"}*0.8

          '
        name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): High error rate'
        event_name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): High error rate (>{$IF.ERRORS.WARN:"{#IFNAME}"} for 5m)'
        opdata: 'errors in: {ITEM.LASTVALUE1}, errors out: {ITEM.LASTVALUE2}'
        priority: WARNING
        description: It recovers when it is below 80% of the `{$IF.ERRORS.WARN:"{#IFNAME}"}` threshold.
        manual_close: 'YES'
        dependencies:
        - name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): Link down'
          expression: '{$IFCONTROL:"{#IFNAME}"}=1 and last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])=2
            and (last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#1)<>last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}],#2))'
          recovery_expression: last(/Aruba 2530 by SNMP/net.if.status[ifOperStatus.{#SNMPINDEX}])<>2 or {$IFCONTROL:"{#IFNAME}"}=0
        tags:
        - tag: scope
          value: availability
        - tag: scope
          value: performance
      graph_prototypes:
      - uuid: 4d78f4eec27842babba9efc36c6bef05
        name: 'Interface {#IFNAME}({#IFALIAS}): Network traffic'
        graph_items:
        - drawtype: GRADIENT_LINE
          color: 199C0D
          item:
            host: Aruba 2530 by SNMP
            key: net.if.in[ifHCInOctets.{#SNMPINDEX}]
        - sortorder: '1'
          drawtype: BOLD_LINE
          color: F63100
          item:
            host: Aruba 2530 by SNMP
            key: net.if.out[ifHCOutOctets.{#SNMPINDEX}]
        - sortorder: '2'
          color: 00611C
          yaxisside: RIGHT
          item:
            host: Aruba 2530 by SNMP
            key: net.if.out.errors[ifOutErrors.{#SNMPINDEX}]
        - sortorder: '3'
          color: F7941D
          yaxisside: RIGHT
          item:
            host: Aruba 2530 by SNMP
            key: net.if.in.errors[ifInErrors.{#SNMPINDEX}]
        - sortorder: '4'
          color: FC6EA3
          yaxisside: RIGHT
          item:
            host: Aruba 2530 by SNMP
            key: net.if.out.discards[ifOutDiscards.{#SNMPINDEX}]
        - sortorder: '5'
          color: 6C59DC
          yaxisside: RIGHT
          item:
            host: Aruba 2530 by SNMP
            key: net.if.in.discards[ifInDiscards.{#SNMPINDEX}]
    - uuid: 7a56821cd62c44d5928f0ae9801edb37
      name: EtherLike-MIB Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SNMPVALUE},1.3.6.1.2.1.10.7.2.1.19,{#IFOPERSTATUS},1.3.6.1.2.1.2.2.1.8,{#IFALIAS},1.3.6.1.2.1.31.1.1.1.18,{#IFNAME},1.3.6.1.2.1.31.1.1.1.1,{#IFDESCR},1.3.6.1.2.1.2.2.1.2]
      key: net.if.duplex.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#IFOPERSTATUS}'
          value: '1'
        - macro: '{#SNMPVALUE}'
          value: (2|3)
      description: Discovering interfaces from IF-MIB and EtherLike-MIB. Interfaces with up(1) Operational Status are discovered.
      item_prototypes:
      - uuid: fe6c2f502b5745dfab7d14d2444bdb89
        name: 'Interface {#IFNAME}({#IFALIAS}): Duplex status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.10.7.2.1.19.{#SNMPINDEX}]
        key: net.if.duplex[dot3StatsDuplexStatus.{#SNMPINDEX}]
        description: 'MIB: EtherLike-MIB

          The current mode of operation of the MAC

          entity.  ''unknown'' indicates that the current

          duplex mode could not be determined.


          Management control of the duplex mode is

          accomplished through the MAU MIB.  When

          an interface does not support autonegotiation,

          or when autonegotiation is not enabled, the

          duplex mode is controlled using

          ifMauDefaultType.  When autonegotiation is

          supported and enabled, duplex mode is controlled

          using ifMauAutoNegAdvertisedBits.  In either

          case, the currently operating duplex mode is

          reflected both in this object and in ifMauType.


          Note that this object provides redundant

          information with ifMauType.  Normally, redundant

          objects are discouraged.  However, in this

          instance, it allows a management application to

          determine the duplex status of an interface

          without having to know every possible value of

          ifMauType.  This was felt to be sufficiently

          valuable to justify the redundancy.

          Reference: [IEEE 802.3 Std.], 30.3.1.1.32,aDuplexStatus.

          '
        valuemap:
          name: EtherLike-MIB::dot3StatsDuplexStatus
        tags:
        - tag: component
          value: network
        - tag: description
          value: '{#IFALIAS}'
        - tag: interface
          value: '{#IFNAME}'
        trigger_prototypes:
        - uuid: 9549cf017f0f45c5b7a86b3fdb4825da
          expression: last(/Aruba 2530 by SNMP/net.if.duplex[dot3StatsDuplexStatus.{#SNMPINDEX}])=2
          name: 'Aruba 2530: Interface {#IFNAME}({#IFALIAS}): In half-duplex mode'
          priority: WARNING
          description: Please check autonegotiation settings and cabling.
          manual_close: 'YES'
          tags:
          - tag: scope
            value: performance
      preprocessing:
      - type: JAVASCRIPT
        parameters:
        - "try {\n\tvar data = JSON.parse(value);\n}\ncatch (error) {\n\tthrow 'Failed to parse JSON of EtherLike-MIB discovery.';\n\
          }\nvar fields = ['{#SNMPVALUE}','{#IFOPERSTATUS}','{#IFALIAS}','{#IFNAME}','{#IFDESCR}'];\ndata.forEach(function\
          \ (element) {\n\tfields.forEach(function (field) {\n\t\telement[field] = element[field] || '';\n\t});\n});\nreturn\
          \ JSON.stringify(data);\n"
    - uuid: 8046d42cf65943ecb445d17881a6c78b
      name: PSU Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#ENT_CLASS},1.3.6.1.4.1.11.2.14.11.1.2.6.1.2,{#ENT_DESCR},1.3.6.1.4.1.11.2.14.11.1.2.6.1.7,{#ENT_STATUS},1.3.6.1.4.1.11.2.14.11.1.2.6.1.4]
      key: psu.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#ENT_CLASS}'
          value: .+8.3.1$
        - macro: '{#ENT_STATUS}'
          value: (1|2|3|4)
      description: 'Discovering all entities of hpicfSensorObjectId that ends with: 11.2.3.7.8.3.1 - power supplies and are
        present'
      item_prototypes:
      - uuid: f6ff9fe8c8f84bc4bcdf850dcf28e4df
        name: '{#ENT_DESCR}: Power supply status'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.4.1.11.2.14.11.1.2.6.1.4.{#SNMPINDEX}]
        key: sensor.psu.status[hpicfSensorStatus.{#SNMPINDEX}]
        delay: 3m
        trends: '0'
        description: 'MIB: HP-ICF-CHASSIS

          Actual status indicated by the sensor: {#ENT_DESCR}

          '
        valuemap:
          name: HP-ICF-CHASSIS::hpicfSensorStatus
        tags:
        - tag: component
          value: power
        trigger_prototypes:
        - uuid: b278eadb28a243f2abbc0163dc756564
          expression: count(/Aruba 2530 by SNMP/sensor.psu.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_CRIT_STATUS:\"bad\"}")=1
          name: 'Aruba 2530: {#ENT_DESCR}: Power supply is in critical state'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          description: Please check the power supply unit for errors
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
        - uuid: 1fda4fcc732a4c95990117af9aa8b8ba
          expression: count(/Aruba 2530 by SNMP/sensor.psu.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_WARN_STATUS:\"warning\"}")=1
          name: 'Aruba 2530: {#ENT_DESCR}: Power supply is in warning state'
          opdata: 'Current state: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: Please check the power supply unit for errors
          dependencies:
          - name: 'Aruba 2530: {#ENT_DESCR}: Power supply is in critical state'
            expression: count(/Aruba 2530 by SNMP/sensor.psu.status[hpicfSensorStatus.{#SNMPINDEX}],#1,"eq","{$PSU_CRIT_STATUS:\"bad\"}")=1
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
    - uuid: 6b1deb8aff3545908993911990882d99
      name: Temperature Discovery
      type: SNMP_AGENT
      snmp_oid: discovery[{#SENSOR_TYPE},1.3.6.1.2.1.99.1.1.1.1,{#SENSOR_INFO},1.3.6.1.2.1.47.1.1.1.1.2,{#SENSOR_PRECISION},1.3.6.1.2.1.99.1.1.1.3]
      key: temp.precision0.discovery
      delay: 1h
      filter:
        evaltype: AND
        conditions:
        - macro: '{#SENSOR_PRECISION}'
          value: '0'
        - macro: '{#SENSOR_TYPE}'
          value: '8'
      description: ENTITY-SENSORS-MIB::EntitySensorDataType discovery with temperature filter
      item_prototypes:
      - uuid: c16b83d2437a4c429607177f8ee67f6b
        name: '{#SENSOR_INFO}: Temperature'
        type: SNMP_AGENT
        snmp_oid: get[1.3.6.1.2.1.99.1.1.1.4.{#SNMPINDEX}]
        key: sensor.temp.value[entPhySensorValue.{#SNMPINDEX}]
        delay: 3m
        value_type: FLOAT
        units: °C
        description: 'MIB: ENTITY-SENSORS-MIB

          The most recent measurement obtained by the agent for this sensor.

          To correctly interpret the value of this object, the associated entPhySensorType,

          entPhySensorScale, and entPhySensorPrecision objects must also be examined.

          '
        tags:
        - tag: component
          value: temperature
        trigger_prototypes:
        - uuid: 49da350171ba48cd80103a110583ea01
          expression: avg(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT:"{#SENSOR_INFO}"}
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: max(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT:"{#SENSOR_INFO}"}-3
          name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is above critical threshold'
          event_name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is above critical threshold: >{$TEMP_CRIT:"{#SENSOR_INFO}"}'
          opdata: 'Current value: {ITEM.LASTVALUE1}'
          priority: HIGH
          description: This trigger uses temperature sensor values as well as temperature sensor status if available
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
        - uuid: 96fec9bf068643b79651014f499b06c0
          expression: avg(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)>{$TEMP_WARN:"{#SENSOR_INFO}"}
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: max(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)<{$TEMP_WARN:"{#SENSOR_INFO}"}-3
          name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is above warning threshold'
          event_name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is above warning threshold: >{$TEMP_WARN:"{#SENSOR_INFO}"}'
          opdata: 'Current value: {ITEM.LASTVALUE1}'
          priority: WARNING
          description: This trigger uses temperature sensor values as well as temperature sensor status if available
          dependencies:
          - name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is above critical threshold'
            expression: avg(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT:"{#SENSOR_INFO}"}
            recovery_expression: max(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT:"{#SENSOR_INFO}"}-3
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
        - uuid: 28876daf853c4f66ab3ccbe211e8db4e
          expression: avg(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)<{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}
          recovery_mode: RECOVERY_EXPRESSION
          recovery_expression: min(/Aruba 2530 by SNMP/sensor.temp.value[entPhySensorValue.{#SNMPINDEX}],5m)>{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}+3
          name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is too low'
          event_name: 'Aruba 2530: {#SENSOR_INFO}: Temperature is too low: <{$TEMP_CRIT_LOW:"{#SENSOR_INFO}"}'
          opdata: 'Current value: {ITEM.LASTVALUE1}'
          priority: AVERAGE
          tags:
          - tag: scope
            value: availability
          - tag: scope
            value: performance
    - uuid: 30a5ef6b241b497a9a2c5986ed50b484
      name: Temp Status Discovery
