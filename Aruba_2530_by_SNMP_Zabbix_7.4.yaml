  triggers:
  - uuid: cf266a59df2b4aa2af224d6763098b6d
    expression: (last(/Aruba 2530 by SNMP/system.hw.uptime[hrSystemUptime.0])>0 and last(/Aruba 2530 by SNMP/system.hw.uptime[hrSystemUptime.0])<10m)
      or (last(/Aruba 2530 by SNMP/system.hw.uptime[hrSystemUptime.0])=0 and last(/Aruba 2530 by SNMP/system.net.uptime[sysUpTime.0])<10m)
    name: 'Aruba 2530: Host has been restarted'
    event_name: 'Aruba 2530: {HOST.NAME} has been restarted (uptime < 10m)'
    priority: WARNING
    description: Uptime is less than 10 minutes.
    manual_close: 'YES'
    dependencies:
    - name: 'Aruba 2530: No SNMP data collection'
      expression: max(/Aruba 2530 by SNMP/zabbix[host,snmp,available],{$SNMP.TIMEOUT})=0
    tags:
    - tag: scope
      value: notice
  graphs:
  - uuid: 9eb180859bf447eaaa6515e4a7e16507
    name: 'Aruba 2530: CPU utilization'
    ymin_type_1: FIXED
    ymax_type_1: FIXED
    graph_items:
    - drawtype: GRADIENT_LINE
      color: 199C0D
      item:
        host: Aruba 2530 by SNMP
        key: system.cpu.util[hpSwitchCpuStat.0]
